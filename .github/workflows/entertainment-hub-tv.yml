name: Build Entertainment Hub TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - all-in-one-entertainment-tv

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract Entertainment Hub TV
        run: |
          rm -rf extracted
          unzip -q EntertainmentHubTV.zip -d extracted

      - name: Build debug APK
        working-directory: extracted/EntertainmentHubTV
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -s extracted/EntertainmentHubTV/app/build/outputs/apk/debug/app-debug.apk
          ls -lh extracted/EntertainmentHubTV/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: entertainment-hub-tv-debug-apk
          path: extracted/EntertainmentHubTV/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
