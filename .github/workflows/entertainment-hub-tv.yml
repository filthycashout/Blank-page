name: Build Entertainment Hub TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - all-in-one-entertainment-tv

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Reconstruct and extract Entertainment Hub TV
        shell: bash
        run: |
          rm -rf extracted EntertainmentHubTV.rebuilt.zip
          for part in buildparts/EntertainmentHubTV.b64.part-*; do
            base64 -d "$part"
          done > EntertainmentHubTV.rebuilt.zip
          unzip -t EntertainmentHubTV.rebuilt.zip
          unzip -q EntertainmentHubTV.rebuilt.zip -d extracted

      - name: Normalize JVM target
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("extracted/EntertainmentHubTV/app/build.gradle.kts"); s=p.read_text(); m="    buildFeatures { compose = true }"; b="\n\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }"; p.write_text(s if "sourceCompatibility = JavaVersion.VERSION_17" in s else s.replace(m, m+b))'
      - name: Build debug APK
        working-directory: extracted/EntertainmentHubTV
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="extracted/EntertainmentHubTV/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ls -lh "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: entertainment-hub-tv-debug-apk
          path: extracted/EntertainmentHubTV/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
