name: Build PhilthySports Android

on:
  push:
    branches:
      - philthysports
    paths:
      - "PhilthySports/**"
      - ".github/workflows/philthysports-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Source secret scan
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("PhilthySports")
          pattern = re.compile(
              r"""(?ix)
              (?:api[_-]?key|secret|access[_-]?token|auth[_-]?token|private[_-]?key)
              \s*[:=]\s*
              ["']
              ([A-Za-z0-9_./+=-]{20,})
              ["']
              """
          )

          findings = []
          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              if path.name in {".env.example"}:
                  continue
              if path.suffix.lower() in {".apk", ".zip", ".png", ".jpg", ".jpeg", ".gif", ".joblib", ".parquet"}:
                  continue
              try:
                  source = path.read_text(encoding="utf-8")
              except Exception:
                  continue
              for match in pattern.finditer(source):
                  findings.append(f"{path}: possible embedded secret ({match.group(1)[:4]}...)")

          if findings:
              raise SystemExit("\n".join(findings))
          print("PhilthySports source secret scan: 0 findings")
          PY

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate backend source
        run: |
          python -m py_compile PhilthySports/backend/app.py
          python -m py_compile PhilthySports/backend/selftest.py
          python -m py_compile PhilthySports/backend/secret_scan.py
          python -m py_compile PhilthySports/backend/live_smoke.py
          python -m py_compile PhilthySports/backend/v6_evidence_audit.py

      - name: Install backend test dependencies
        run: python -m pip install -r PhilthySports/backend/requirements.txt

      - name: Secret scan
        run: python PhilthySports/backend/secret_scan.py

      - name: Reproduce v6 chronology calibration leakage evidence
        run: python PhilthySports/backend/v6_evidence_audit.py

      - name: Backend v6 contract selftest
        env:
          CREDENTIAL_ROTATION_CONFIRMED: "false"
          PHILTHY_LIVE_ENABLED: "false"
        run: python PhilthySports/backend/selftest.py

      - name: Live ESPN four-sport smoke
        run: python PhilthySports/backend/live_smoke.py

      - name: Backend container launch smoke
        shell: bash
        run: |
          set -euo pipefail
          docker build -t philthysports-backend:audit PhilthySports/backend
          docker run -d --rm --name philthysports-backend-audit \
            -p 18000:8000 \
            -e CREDENTIAL_ROTATION_CONFIRMED=false \
            -e PHILTHY_LIVE_ENABLED=false \
            philthysports-backend:audit
          cleanup() { docker rm -f philthysports-backend-audit >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18000/health >/tmp/philthy-health.json; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:18000/health | python -m json.tool
          curl --fail --silent http://127.0.0.1:18000/v1/system/status | python -m json.tool
          curl --fail --silent http://127.0.0.1:18000/v1/models/status | python -m json.tool
          curl --fail --silent http://127.0.0.1:18000/v1/protocol | python -m json.tool


      - name: Public Powerhouse v6 smoke
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          base = "https://philthysports-powerhouse.onrender.com"

          def get(path, timeout=30):
              request = urllib.request.Request(
                  base + path,
                  headers={"User-Agent": "PhilthySports-CI/1.3"},
              )
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  if response.status != 200:
                      raise RuntimeError(f"{path}: HTTP {response.status}")
                  return json.loads(response.read().decode("utf-8"))

          health = None
          last_error = None
          for _ in range(36):
              try:
                  candidate = get("/health")
                  if candidate.get("version") == "1.3.0-v6-evidence-routed":
                      health = candidate
                      break
              except Exception as exc:
                  last_error = exc
              time.sleep(5)

          if health is None:
              raise RuntimeError("Powerhouse did not expose v1.3.0") from last_error

          system = get("/v1/system/status")
          models = get("/v1/models/status")
          odds = get("/v1/odds/nfl?days=2")

          gates = system["gates"]
          assert gates["chronology"] == "PASS"
          assert gates["calibration"] == "PASS"
          assert gates["leakage"] == "PASS"
          assert gates["credential"] == "PASS_KEYLESS_PRIMARY"
          assert gates["model_policy"] == "V6_EVIDENCE_ROUTED"
          assert gates["pass_for_live"] is True
          assert models["sports"]["MLB"]["promotion_pass"] is True
          for sport in ("NFL", "NBA", "NHL"):
              assert models["sports"][sport]["production_state"] == "V6_MARKET_FALLBACK"
          assert odds["provider"] == "ESPN keyless pregame market"
          print("Public Powerhouse v6 smoke: PASS")
          PY

      - name: Generate Android wrapper and copy PhilthySports source
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="$RUNNER_TEMP/philthysports_build"
          rm -rf "$APP_DIR"

          flutter create             --platforms=android             --org com.philthysports             --project-name philthysports             "$APP_DIR"

          cp PhilthySports/pubspec.yaml "$APP_DIR/pubspec.yaml"
          rm -rf "$APP_DIR/lib" "$APP_DIR/test"
          cp -R PhilthySports/lib "$APP_DIR/lib"
          cp -R PhilthySports/test "$APP_DIR/test"

          python - <<'PY'
          from pathlib import Path

          path = Path(__import__("os").environ["RUNNER_TEMP"]) / "philthysports_build/android/app/src/main/AndroidManifest.xml"
          text = path.read_text()

          if "android.permission.INTERNET" not in text:
              marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
              text = text.replace(
                  marker,
                  marker + '\n    <uses-permission android:name="android.permission.INTERNET"/>',
                  1,
              )

          text = text.replace('android:label="philthysports"', 'android:label="PhilthySports"')
          path.write_text(text)
          PY

          cd "$APP_DIR"
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --release

          cp build/app/outputs/flutter-apk/app-release.apk \
            "$GITHUB_WORKSPACE/PhilthySports-release.apk"

      - name: Verify APK signature and metadata
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose PhilthySports-release.apk
          "$BUILD_TOOLS/aapt" dump badging PhilthySports-release.apk | head -20

      - name: Create checksum
        run: sha256sum PhilthySports-release.apk | tee PhilthySports-release.apk.sha256

      - name: Package source snapshot
        shell: bash
        run: |
          find PhilthySports -type d -name __pycache__ -prune -exec rm -rf {} +
          find PhilthySports -type f -name '*.pyc' -delete
          zip -r PhilthySports-source.zip PhilthySports \
            -x '*/__pycache__/*' '*.pyc' >/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhilthySports-APK
          path: |
            PhilthySports-release.apk
            PhilthySports-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: PhilthySports-Source
          path: PhilthySports-source.zip
          if-no-files-found: error
          retention-days: 30
